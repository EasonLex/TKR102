[project]
name = "trafficproject"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "EthanLin", email = "eason.lin@ascentis.com.sg" }
]
requires-python = ">=3.13"
dependencies = [
    "confluent-kafka>=2.15.0",
    "cryptography>=50.0.0",
    "gcsfs>=2026.8.0",
    "google>=3.0.0",
    "google-cloud-bigquery>=3.44.0",
    "google-cloud-storage>=3.13.1",
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.1",
    "pandas>=3.0.5",
    "pyarrow>=25.0.0",
    "pymongo>=4.17.0",
    "pymysql>=1.2.0",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
]

[project.scripts]
trafficproject = "trafficproject:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
